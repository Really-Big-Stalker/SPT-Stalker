name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mod data
        run: python3 tools/validate_data.py

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build server mod
        run: dotnet build src/SPTStalker/SPTStalker.csproj -c Release

      - name: Build client plugin
        run: dotnet build client/SPTStalker.Client/SPTStalker.Client.csproj -c Release

      - name: Fetch reference assemblies for the bots plugin (not shipped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p lib bigbrain
          # SPT's public, code-stripped Assembly-CSharp (names only) for compiling against EFT types
          curl -fsSL -o lib/hollowed.dll https://raw.githubusercontent.com/sp-tarkov/modules/4.1.2/project/Shared/Hollowed/hollowed.dll
          # BigBrain (DrakiaXYZ) release for its CustomLayer/CustomLogic API
          gh release download 1.5.0 -R DrakiaXYZ/SPT-BigBrain -D bigbrain
          for z in bigbrain/*.zip bigbrain/*.7z; do [ -f "$z" ] && 7z x -y -obigbrain "$z" > /dev/null; done
          find bigbrain -name 'DrakiaXYZ-BigBrain.dll' -exec cp {} lib/ \;
          ls -la lib

      - name: Build bots plugin
        run: dotnet build bots/SPTStalker.Bots/SPTStalker.Bots.csproj -c Release

      - name: Package for SPT (user/mods/SPTStalker + BepInEx/plugins/SPTStalker)
        run: |
          mkdir -p dist/SPT/user/mods
          cp -r src/SPTStalker/bin/Release/SPTStalker dist/SPT/user/mods/SPTStalker
          # Only the mod's own assembly + data belong in the package
          find dist/SPT/user/mods/SPTStalker -maxdepth 1 -type f ! -name 'SPTStalker.dll' ! -name 'SPTStalker.pdb' ! -name 'bundles.json' -delete
          mkdir -p dist/SPT/BepInEx/plugins/SPTStalker
          cp client/SPTStalker.Client/bin/Release/SPTStalker.Client.dll dist/SPT/BepInEx/plugins/SPTStalker/
          cp bots/SPTStalker.Bots/bin/Release/SPTStalker.Bots.dll dist/SPT/BepInEx/plugins/SPTStalker/
          ls -R dist

      - uses: actions/upload-artifact@v4
        with:
          name: SPTStalker
          path: dist/
